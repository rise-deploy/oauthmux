name: Publish image

on:
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: blacksmith-8vcpu-ubuntu-2404
            platform: linux/amd64
          - architecture: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: oauthmux-${{ matrix.architecture }}
      - uses: useblacksmith/build-push-action@v2
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: useblacksmith/setup-docker-builder@v2
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Create manifest
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          sources=()
          for digest in "${{ runner.temp }}/digests/"*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.metadata.outputs.version }}"
