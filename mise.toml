[tools]
actionlint = "1.7.12"
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
shellcheck = "0.11.0"

[tasks.check]
description = "Run all local quality gates"
run = [
  "actionlint",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
]

[tasks.e2e]
description = "Run Docker-backed end-to-end tests"
run = "bash tests/e2e/run.sh"
