[package]
name = "oauthmux"
description = "Standalone oauthmux server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["lambda"]
lambda = ["dep:lambda_http"]

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-ssm.workspace = true
axum.workspace = true
base64.workspace = true
lambda_http = { workspace = true, optional = true }
oauthmux-core = { path = "../oauthmux-core" }
oauthmux-provider-file = { path = "../oauthmux-provider-file" }
oauthmux-provider-ssm = { path = "../oauthmux-provider-ssm" }
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[bin]]
name = "oauthmux"
path = "src/main.rs"

[dev-dependencies]
async-trait.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
