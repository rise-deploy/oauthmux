[tools]
actionlint = "1.7.12"
node = "24.19.0"
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
shellcheck = "0.11.0"

[tasks.check]
description = "Run all local quality gates"
run = [
  "actionlint",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "mise run features:check",
  "cargo test --workspace --all-features",
  "mise run schema:check",
  "mise run docs",
]

[tasks.docs]
description = "Build the documentation site"
dir = "docs"
run = "npm ci && npm run build"

[tasks.schema]
description = "Generate the oauthmux configuration schema"
run = "cargo run -q -p oauthmux -- schema > docs/public/oauthmux.schema.json"

[tasks."schema:check"]
description = "Check the generated oauthmux configuration schema"
run = "cargo run -q -p oauthmux -- schema | diff -u docs/public/oauthmux.schema.json -"

[tasks."features:check"]
description = "Check standalone binary feature combinations"
run = [
  "cargo check -p oauthmux --no-default-features",
  "cargo check -p oauthmux --no-default-features --features aws",
  "cargo check -p oauthmux --no-default-features --features lambda",
]

[tasks."docs:serve"]
description = "Serve the documentation site locally"
dir = "docs"
run = "npm ci && npm run dev"

[tasks.e2e]
description = "Run Docker-backed end-to-end tests"
run = "bash tests/e2e/run.sh"
