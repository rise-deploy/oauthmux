[package]
name = "oauthmux"
description = "Standalone oauthmux server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["aws", "lambda"]
aws = [
  "dep:async-trait",
  "dep:aws-config",
  "dep:aws-sdk-secretsmanager",
  "dep:aws-sdk-ssm",
  "dep:oauthmux-provider-ssm",
  "oauthmux-provider-ssm/aws",
]
lambda = ["dep:lambda_http"]

[dependencies]
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
lambda_http = { workspace = true, optional = true }
oauthmux-core = { path = "../oauthmux-core" }
oauthmux-provider-file = { path = "../oauthmux-provider-file" }
oauthmux-provider-ssm = { path = "../oauthmux-provider-ssm", default-features = false, optional = true }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[bin]]
name = "oauthmux"
path = "src/main.rs"

[dev-dependencies]
jsonwebtoken.workspace = true
serde.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
